<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin login — Coaching Hockey Made Easy</title>
  <link rel="icon" href="/img/logo.jpeg" type="image/jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-950 text-slate-100 p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-block w-14 h-14 rounded-xl overflow-hidden border border-slate-600">
        <img src="/img/logo.jpeg" alt="Coaching Hockey Made Easy" class="w-full h-full object-cover">
      </div>
      <h1 class="text-2xl font-bold">Admin</h1>
      <p class="text-slate-400 text-sm">Sign in to add subscription videos and playbooks.</p>
    </div>

    <div id="alertBox" class="hidden p-3 rounded-lg text-sm font-medium"></div>

    <form id="adminLoginForm" class="space-y-4">
      <div>
        <label for="adminEmail" class="block text-xs uppercase text-slate-400 mb-1">Email</label>
        <input type="email" id="adminEmail" required autocomplete="username" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label for="adminPassword" class="block text-xs uppercase text-slate-400 mb-1">Password</label>
        <input type="password" id="adminPassword" required autocomplete="current-password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2.5 rounded-lg transition shadow-lg">Log in</button>
    </form>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    const existing = (() => {
      try { return JSON.parse(localStorage.getItem('user') || 'null'); } catch { return null; }
    })();
    if (localStorage.getItem('token') && existing?.role === 'ADMIN') {
      window.location.replace('/admin.html');
    }

    document.getElementById('adminLoginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const box = document.getElementById('alertBox');
      box.classList.add('hidden');
      try {
        const data = await apiFetch('/auth/admin-login', {
          method: 'POST',
          body: JSON.stringify({
            email: document.getElementById('adminEmail').value,
            password: document.getElementById('adminPassword').value
          })
        });
        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data.user));
        window.location.href = '/admin.html';
      } catch (err) {
        box.classList.remove('hidden', 'bg-emerald-900/50', 'text-emerald-200');
        box.classList.add('bg-red-900/50', 'text-red-200');
        box.textContent = err.message || 'Could not sign in.';
      }
    });
  </script>
</body>
</html>
