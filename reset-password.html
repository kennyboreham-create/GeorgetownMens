<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coaching Hockey Made Easy - Reset Password</title>
  <link rel="icon" href="/img/logo.jpeg" type="image/jpeg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="flex items-center justify-center min-h-screen bg-slate-900 text-slate-100 p-4">

  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-8 space-y-6">
    <div class="text-center space-y-2">
      <a href="/" class="inline-block w-14 h-14 rounded-xl overflow-hidden border border-slate-600" title="Product home">
        <img src="/img/logo.jpeg" alt="Coaching Hockey Made Easy" class="w-full h-full object-cover">
      </a>
      <h1 id="resetTitle" class="text-2xl font-bold">Reset Password</h1>
      <p id="resetSubtitle" class="text-slate-400 text-sm">Choose a new password for your coaching account</p>
    </div>

    <div id="alertBox" class="hidden p-3 rounded-lg text-sm font-medium"></div>

    <form id="resetForm" onsubmit="handleResetPassword(event)" class="space-y-4">
      <div>
        <label for="newPassword" class="block text-xs uppercase text-slate-400 mb-1">New Password</label>
        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <div>
        <label for="confirmPassword" class="block text-xs uppercase text-slate-400 mb-1">Confirm Password</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-blue-500">
      </div>
      <button id="resetSubmitBtn" type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-2.5 rounded-lg transition shadow-lg">Update Password</button>
    </form>

    <p class="text-center text-sm text-slate-500">
      <a href="/login.html" class="text-blue-400 hover:text-blue-300">Back to login</a>
    </p>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    function showAlert(msg, isSuccess = false) {
      const box = document.getElementById('alertBox');
      box.classList.remove('hidden', 'bg-red-900/50', 'text-red-200', 'bg-emerald-900/50', 'text-emerald-200');
      box.classList.add(isSuccess ? 'bg-emerald-900/50' : 'bg-red-900/50');
      box.classList.add(isSuccess ? 'text-emerald-200' : 'text-red-200');
      box.innerText = msg;
    }

    async function handleResetPassword(e) {
      e.preventDefault();

      const token = new URLSearchParams(window.location.search).get('token');
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (!token) {
        showAlert('Missing or invalid reset link. Request a new one from the login page.', false);
        return;
      }

      if (password !== confirm) {
        showAlert('Passwords do not match.', false);
        return;
      }

      if (password.length < 6) {
        showAlert('Password must be at least 6 characters.', false);
        return;
      }

      try {
        const data = await apiFetch('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, password })
        });
        showAlert(data.message, true);
        setTimeout(() => {
          window.location.href = '/login.html';
        }, 1500);
      } catch (err) {
        showAlert(err.message, false);
      }
    }

    (function checkToken() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('invite') === '1') {
        document.title = 'Coaching Hockey Made Easy - Create Password';
        document.getElementById('resetTitle').innerText = 'Create Password';
        document.getElementById('resetSubtitle').innerText = 'Choose a password for your assistant coach account';
        document.getElementById('resetSubmitBtn').innerText = 'Create Password';
      }
      if (!params.get('token')) {
        showAlert(
          params.get('invite') === '1'
            ? 'Missing invite token. Open the link from your invite email, or ask your head coach to add you again.'
            : 'Missing reset token. Open the link from your email, or request a new one.',
          false
        );
        document.getElementById('resetForm').classList.add('hidden');
      }
    })();
  </script>
</body>
</html>
